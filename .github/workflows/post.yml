name: GCGN auto-poster

on:
  schedule:
    # Every hour, 14:00-23:00 UTC = roughly 9 AM-6 PM Eastern year round.
    # GitHub's cron is often late; post.py only posts what is due and not yet
    # logged today, so late or repeated runs are harmless.
    - cron: "0 14-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Post to Facebook as unpublished, skip Instagram, don't log"
        type: boolean
        default: false
      only_slot:
        description: "Force one slot now (e.g. burgr-bingo-tonight, qotw). Blank = whatever is due."
        type: string
        default: ""
      only_num:
        description: "With qotw: force a specific queue number"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post what is due
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          ONLY_SLOT: ${{ inputs.only_slot }}
          ONLY_NUM: ${{ inputs.only_num }}
        run: python3 post.py

      - name: Commit log and queue
        run: |
          git config user.name "gcgn-bot"
          git config user.email "gcgn-bot@users.noreply.github.com"
          git add log.csv queue.csv
          git diff --cached --quiet || (git commit -m "Posted $(TZ=America/New_York date '+%a %Y-%m-%d %H:%M ET')" && git pull --rebase && git push)
